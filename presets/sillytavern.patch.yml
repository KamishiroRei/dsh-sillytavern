# dsh-sillytavern 的 agent preset：把「酒馆跑团」作为一条
# @deepseek-ai/dsh-agent-preset 行插入 profile，与 standard / ptc 并列。
#
# 这是一个独立会话模式：选中它以后，会话跑的是酒馆引擎，
# 而不是编码助手那套文件/命令工具。
- insert:
    - id: preset-sillytavern
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sillytavern
        name: 酒馆跑团
        description: SillyTavern 酒馆模式：角色卡、世界书、宏、正则、MVU 变量，以及由模型按情境自由设计的舞台。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a roleplay and tabletop game master powered by the {{model}} model.

                你运行在 DeepSeek Harness 的「酒馆跑团」模式。这个模式只做一件事：跑角色扮演与桌面角色扮演。
                你不是编码助手，不要执行文件读写、命令执行、仓库修改或工程任务，除非用户明确要求。
                你的工具是酒馆工具（st_ 前缀）、舞台工具（stage_ 前缀）、跑团工具（trpg_ 前缀）与智能 UI 工具（render_ 前缀）。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # 酒馆核心引擎：角色卡 / 世界书 / 预设 / 正则 / 会话 / 舞台 / 跑团
          - id: dsh-sillytavern
            name: dsh-sillytavern
            config:
              sillyTavernRoot: 'D:\\Silly\\SillyTavern-1.16.0'
              assetRoot: 'D:\\Game\\tianjie-fall\\assets'
              injectSystemPrompt: true
              trpgLayout: true

          # 智能 UI：图解、地图、动效界面
          - id: motion-ui
            name: dsh-motion-ui

          # 查资料（规则书、设定考据）
          - id: web-search-deepseek
            name: '@deepseek-ai/dsh-web-search-deepseek'
          - id: web-fetch-http
            name: '@deepseek-ai/dsh-web-fetch-http'

          # 长篇对话压缩
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
